<div class="space-y-2">
    <label for="p_name" class="block text-sm font-medium text-gray-700">Project Name</label>

    <input 
    [value]="searchText()"
    (input)="searchText.set($event.target.value)"
    id="p_name" 
    type="text" 
    placeholder="Enter project name" 
    class="w-full px-3 py-2 border rounded-lg shadow-sm 
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
             transition duration-150" />

                 <button (click)="testValue()"
      type="submit"
      class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg 
             hover:bg-blue-700 transition duration-200"
    >
      Submit
    </button>
</div>
