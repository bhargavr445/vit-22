<button (click)="fetchName()">Display Name</button>
<h1>{{name()}}</h1>


<form [formRoot]="dashboardForm" class="space-y-6 p-6 bg-white rounded-xl shadow-md max-w-md mx-auto">

    <!-- Name -->
    <div class="flex flex-col space-y-1">
        <label for="userName" class="text-sm font-medium text-gray-700">Name</label>
        <input id="userName" type="text" [formField]="dashboardForm.userName"
            class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter your name" />
    </div>

    <!-- Email -->
    <div class="flex flex-col space-y-1">
        <label for="password" class="text-sm font-medium text-gray-700">Email</label>
        <input id="password" type="password" [formField]="dashboardForm.password"
            class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter your email" />
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-all">Submit</button>

</form>
